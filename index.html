<div class="game">
  <h1>🧠 ذهن‌خوان</h1>

  <p id="text">من می‌تونم ذهن تو رو بخونم!</p>

  <input id="number" type="number" min="1" max="100"
         placeholder="عددت را وارد کن" style="display:none;">

  <button onclick="nextStep()">ادامه</button>
</div>

<script>
let step = 0;
let chosenNumber = "";

function nextStep() {
  if (step === 0) {
    document.getElementById("text").innerText =
      "حالا به یک عدد بین ۱ تا ۱۰۰ فکر کن.";
    step = 1;

  } else if (step === 1) {
    document.getElementById("text").innerText =
      "حالا عددی که بهش فکر کردی رو وارد کن.";

    document.getElementById("number").style.display = "block";
    step = 2;

  } else if (step === 2) {
    chosenNumber = document.getElementById("number").value;

    if (chosenNumber === "") {
      document.getElementById("text").innerText =
        "اول عددی که بهش فکر کردی رو وارد کن!";
      return;
    }

    document.getElementById("text").innerText =
      "🧠 در حال ذهن‌خوانی...";

    document.getElementById("number").style.display = "none";
    step = 3;

    setTimeout(function() {
      document.getElementById("text").innerText =
        "ذهن‌خوانی با موفقیت انجام شد!\n\nشما به عدد " +
        chosenNumber + " فکر کرده بودید.";
    }, 3000);
  }
}
      </script>
